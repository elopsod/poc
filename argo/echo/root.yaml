apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "1app-root"
spec:
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "argocd"
  project: "default"
  sources:
    - path: "argo/echo/src"
      repoURL: "https://github.com/elopsod/poc.git"
      targetRevision: "main"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - "CreateNamespace=true"
      - "ServerSideApply=true"
